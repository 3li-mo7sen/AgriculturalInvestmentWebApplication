<section class="history-card">
  <div class="history-header">
    <h2>Transaction History</h2>
    <!--
    <button class="history-export">
      <i class="fa-solid fa-download"></i>
      Export
    </button>
    -->
  </div>

  <div class="transaction-list">
    <!-- حالة وجود معاملات -->
    <ng-container *ngIf="transactions && transactions.length > 0; else emptyState">
      <article *ngFor="let tx of transactions" class="transaction-row">
        <!-- Icon changing according to type -->
        <div class="transaction-icon" [ngClass]="tx.type === 'Withdrawal' ? 'icon-muted' : 'icon-green'">
          <svg *ngIf="tx.type !== 'Withdrawal'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="M6 6v12h12" />
          </svg>
          <svg *ngIf="tx.type === 'Withdrawal'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 18 18 6" />
            <path d="M6 18h12V6" />
          </svg>
        </div>

        <div class="transaction-info">
          <h3>{{ tx.description }}</h3>
          <p>{{ tx.date | date:'mediumDate' }} • {{ tx.projectName }}</p>
        </div>

        <div class="transaction-meta">
          <!-- Amount Sign & Style -->
          <span class="amount" [ngClass]="tx.type === 'Withdrawal' ? 'negative' : 'positive'">
            {{ tx.type === 'Withdrawal' ? '-' : '+' }}EGP {{ tx.amount | number }}
          </span>

          <!-- Status Badge -->
          <span class="status" [ngClass]="tx.status.toLowerCase()">
            <i *ngIf="tx.status === 'Completed'" class="fa-regular fa-circle-check"></i>
            <i *ngIf="tx.status === 'Pending'" class="fa-solid fa-clock"></i>
            {{ tx.status }}
          </span>
        </div>
      </article>
    </ng-container>

    <!-- Empty State -->
    <ng-template #emptyState>
      <div class="empty-transactions" style="text-align: center; padding: 2rem; color: #6b7280;">
        <p>No transactions found.</p>
      </div>
    </ng-template>
  </div>
</section>
