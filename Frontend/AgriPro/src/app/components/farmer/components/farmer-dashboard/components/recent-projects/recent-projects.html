<section class="recent-projects-card">
  <div class="recent-header">
    <div>
      <h2>Recent Projects</h2>
    </div>
    <a class="view-all-link" routerLink="/farmer/my-projects">
      View All <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </a>
  </div>

  <div class="table-responsive">
    <table class="projects-table">
      <thead>
        <tr>
          <th>Project</th>
          <th>Status</th>
          <th>Funded</th>
          <th>Progress</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let project of projects">
          <td class="project-name">{{ project.name }}</td>
          <td>
            <span class="status-badge" [ngClass]="{
              'status-active': project.status === 'Approved',
              'status-pending': project.status === 'Pending',
              'status-rejected': project.status === 'Rejected'
            }">
              <i class="fa-solid fa-circle" style="font-size: 6px;"></i> {{ project.status }}
            </span>
          </td>
          <td style="font-weight: 600; color: #334155;">EGP {{ project.fundingRaised | number }}</td>
          <td>
            <div class="progress-container">
              <div class="progress-wrap">
                <div class="progress-bar filled" [style.width.%]="project.fundingProgress"></div>
              </div>
              <span class="progress-text">{{ project.fundingProgress }}%</span>
            </div>
          </td>
          <td style="text-align: center;">
            <a [routerLink]="['/farmer/project-details', project.id]" class="btn-view-details">
              <i class="fa-regular fa-eye"></i> View
            </a>
          </td>
        </tr>

        <tr *ngIf="!projects || projects.length === 0">
          <td colspan="5" style="text-align: center; padding: 2rem; color: #94a3b8;">
            No active projects found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
