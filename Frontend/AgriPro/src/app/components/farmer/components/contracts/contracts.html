<div class="contracts-page">
 
  <ng-container *ngIf="isLoading; else pageContent">
    <div class="skeleton-summary-grid">
      <div class="skeleton-card" *ngFor="let item of [1,2,3]"></div>
    </div>

    <div class="skeleton-search-bar"></div>

    <div class="skeleton-table-wrapper">
      <div class="skeleton-row header"></div>
      <div class="skeleton-row" *ngFor="let item of [1,2,3,4,5]"></div>
    </div>
  </ng-container>

  
  <ng-template #pageContent>
    <app-contract-cards [contracts]="contracts"></app-contract-cards>
    <app-con-search (searchChange)="onSearchChange($event)"
                    (statusChange)="onStatusChange($event)">
    </app-con-search>
    <app-contract-list [contracts]="filteredContracts"></app-contract-list>
  </ng-template>
</div>
