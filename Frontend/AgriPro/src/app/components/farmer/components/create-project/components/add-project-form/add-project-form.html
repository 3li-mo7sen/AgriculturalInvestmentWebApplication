<section class="form-card">
  <div class="form-header">
    <div>
      <h2>Basic Project Information</h2>
      <p>Provide the basic details about your agricultural project.</p>
    </div>
  </div>

  <form class="project-form">
    <div class="field-group">
      <label>Project Title</label>
      <input type="text" [(ngModel)]="data.title" name="title" placeholder="Project Title" />
    </div>

    <div class="field-group">
      <label>Short Description</label>
      <textarea [(ngModel)]="data.shortDescription" name="shortDesc" placeholder="Short Description"></textarea>
      </div>

    <div class="field-group">
      <label>Crop Type</label>
      <div class="select-wrap">
        <select [(ngModel)]="data.cropType" name="crop">
          
          <option value="Wheat">Wheat</option>
          <option value="Mango">Mango</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Cotton">Cotton</option>
        </select>
      </div>
    </div>

    <div class="form-actions">

      <div class="action-group">
        <button type="button" class="btn btn-save">Save Draft</button>
        <button type="button" class="btn btn-primary" (click)="sendData()">Continue</button>
      </div>
    </div>
  </form>
</section>
