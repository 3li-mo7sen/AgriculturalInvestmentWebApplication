<section class="land-form-card">
  <div class="section-header">
    <div>
      <h2>Land Information</h2>
      <p>Provide detailed information about your agricultural land.</p>
    </div>
  </div>

  <form class="land-form">
    <div class="field-group full-width">
      <label>Land Name / Project Name</label>
      <input type="text" placeholder="e.g., El-Nour Farm" />
    </div>

    <div class="grid-two">
      <div class="field-group">
        <label>Governorate</label>
        <div class="select-wrap">
          <select>
            <option>Select governorate</option>
            <option>Beheira</option>
            <option>Giza</option>
            <option>Alexandria</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label>District / Village</label>
        <input type="text" placeholder="Enter district or village" />
      </div>
    </div>

    <div class="grid-two">
      <div class="field-group">
        <label>Land Size (Feddan)</label>
        <input type="text" placeholder="e.g., 10" />
      </div>

      <div class="field-group">
        <label>Soil Type</label>
        <div class="select-wrap">
          <select>
            <option>Select soil type</option>
            <option>Sandy</option>
            <option>Clay</option>
            <option>Loam</option>
          </select>
        </div>
      </div>
    </div>

    <div class="grid-two">
      <div class="field-group">
        <label>Water Source</label>
        <div class="select-wrap">
          <select>
            <option>Select water source</option>
            <option>Canal</option>
            <option>Borewell</option>
            <option>River</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label>Land Ownership Type</label>
        <div class="select-wrap">
          <select>
            <option>Select ownership type</option>
            <option>Owned</option>
            <option>Rented</option>
            <option>Shared</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field-group full-width">
      <label>Expected Crop Season</label>
      <div class="select-wrap">
        <select>
          <option>Select crop season</option>
          <option>Winter</option>
          <option>Summer</option>
          <option>Autumn</option>
        </select>
      </div>
    </div>

    <div class="map-picker">
      <div class="map-icon-large">📍</div>
      <p class="map-label">Optional: Pin your land location on the map</p>
      <button type="button" class="btn btn-map">Open Map Picker</button>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="previous.emit()">Previous</button>
      <div class="action-group">
        <button type="button" class="btn btn-save">Save Draft</button>
        <button type="button" class="btn btn-primary" (click)="continue.emit()">Continue</button>
      </div>
    </div>
  </form>
</section>
