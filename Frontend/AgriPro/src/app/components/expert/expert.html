
<div class="dashboard-wrapper">
  <aside class="sidebar" [class.collapsed]="isCollapsed">

    <div class="sidebar-header">
      <div class="logo-box" *ngIf="!isCollapsed" routerLink="/home" style="cursor: pointer;">
        <img src="../../../assets/images/logo-new.png" alt="Agri-Pro">
        <span>Agri-Pro</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fa-solid" [ngClass]="isCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
      </button>
    </div>

    <nav class="menu-items">
      <a routerLink="dashboard" routerLinkActive="active-link">
        <i class="fa-solid fa-grid-horizontal"></i>
        <span *ngIf="!isCollapsed">Dashboard</span>
      </a>

      <a routerLink="pending-reviews" routerLinkActive="active-link">
        <i class="fa-regular fa-file-lines"></i>
        <span *ngIf="!isCollapsed">Pending Reviews</span>
      </a>

      <a routerLink="verified-projects" routerLinkActive="active-link">
        <i class="fa-regular fa-circle-check"></i>
        <span *ngIf="!isCollapsed">Verified Projects</span>
      </a>

      <a routerLink="rejected-projects" routerLinkActive="active-link">
        <i class="fa-regular fa-circle-xmark"></i>
        <span *ngIf="!isCollapsed">Rejected Projects</span>
      </a>

      <a routerLink="profile" routerLinkActive="active-link">
        <i class="fa-regular fa-user"></i>
        <span *ngIf="!isCollapsed">My Profile</span>
      </a>

      <!--
  <a routerLink="settings" routerLinkActive="active-link">
    <i class="fa-solid fa-gear"></i>
    <span *ngIf="!isCollapsed">Settings</span>
  </a>
  -->
    </nav>

    <div class="sidebar-footer">
      <a (click)="logout()" class="logout-link">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span *ngIf="!isCollapsed">Logout</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <app-expert-nav></app-expert-nav>
    <router-outlet></router-outlet>
  </main>
</div>
