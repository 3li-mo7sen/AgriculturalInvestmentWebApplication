<section class="reviews-search">
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search projects..."
      [value]="searchQuery"
      #searchInput
      (input)="updateSearch(searchInput.value)"
    />
  </div>
  
  <div class="filters">
    <!--
    <div class="filter-item">
      <label>Urgency</label>
      <select #urgencySelect [value]="selectedUrgency" (change)="updateUrgency(urgencySelect.value)">
        <option *ngFor="let option of urgencyOptions" [value]="option">{{ option }}</option>
      </select>
    </div>
    -->
    <div class="filter-item">
      <label>Crop</label>
      <select #cropSelect [value]="selectedCrop" (change)="updateCrop(cropSelect.value)">
        <option *ngFor="let option of cropOptions" [value]="option">{{ option }}</option>
      </select>
    </div>
  </div>
  
</section>
