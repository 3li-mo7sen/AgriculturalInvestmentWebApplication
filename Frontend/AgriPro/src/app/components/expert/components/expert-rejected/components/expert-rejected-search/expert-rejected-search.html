<section class="rejected-search">
  <div class="search-row">
    <label for="rejected-search-input" class="search-label">Search rejected projects</label>
    <input
      id="rejected-search-input"
      type="text"
      [value]="searchQuery"
      placeholder="Search by project, farmer, or location"
      (input)="updateSearch($any($event.target).value)"
    />
  </div>

  <div class="filters">
    <div class="filter-item">
      <label>Crop</label>
      <select [value]="selectedCrop" (change)="updateCrop($any($event.target).value)">
        <option *ngFor="let option of cropOptions" [value]="option">{{ option }}</option>
      </select>
    </div>

    <div class="filter-item">
      <label>Date range</label>
      <select [value]="selectedDateRange" (change)="updateDateRange($any($event.target).value)">
        <option *ngFor="let option of dateRangeOptions" [value]="option">{{ option }}</option>
      </select>
    </div>
  </div>
</section>
