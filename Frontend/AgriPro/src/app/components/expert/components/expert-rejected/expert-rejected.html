<section class="expert-rejected-page">
 
  <div *ngIf="isLoading" class="rejected-loading-container">

    <div class="spinner-wrapper">
      <div class="custom-spinner"></div>
      <p class="loading-text">Loading rejected projects...</p>
    </div>

    <div class="skeleton-metrics-grid">
      <div class="skeleton-card metric-skeleton"></div>
    </div>

    <div class="skeleton-card search-skeleton"></div>

   
    <div class="skeleton-projects-list">
      <div class="skeleton-card project-row-skeleton" *ngFor="let item of [1, 2, 3, 4]">
        <div class="skeleton-body">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line reason"></div>
        </div>
      </div>
    </div>

  </div>

  <ng-container *ngIf="!isLoading">
    <app-expert-rejected-cards [cards]="summaryCards"></app-expert-rejected-cards>

    <app-expert-rejected-search [searchQuery]="searchQuery"
                                [selectedCrop]="selectedCrop"
                                [selectedDateRange]="selectedDateRange"
                                [cropOptions]="['All Crops', 'Wheat', 'Fruits', 'Rice', 'Maize']"
                                [dateRangeOptions]="['All Time', 'Last 30 Days', 'Last 90 Days']"
                                (searchChange)="onSearch($event)"
                                (cropChange)="onCrop($event)"
                                (dateRangeChange)="onDateRange($event)">
    </app-expert-rejected-search>

    <app-expert-rejected-list [projects]="filteredProjects"></app-expert-rejected-list>
  </ng-container>
</section>
