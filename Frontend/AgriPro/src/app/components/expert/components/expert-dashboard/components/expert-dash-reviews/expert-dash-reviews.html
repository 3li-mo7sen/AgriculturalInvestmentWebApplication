<div class="reviews-container">
  <div class="reviews-header">
    <h2 class="reviews-title">Recent Reviews</h2>
  </div>

  <div class="reviews-list">
    <ng-container *ngIf="reviews && reviews.length > 0; else noReviews">
      <div class="review-item" *ngFor="let review of reviews">
        <div class="review-content">
          <div class="review-top">
            <div class="project-header">
              <h3 class="project-name">{{ review.projectName }}</h3>
              <span [ngClass]="['priority-badge', getStatusClass(review.status)]">
                {{ review.status }}
              </span>
            </div>
          </div>

          <div class="review-meta">
            <span class="meta-text">Farmer: {{ review.farmerName }}</span>
            <span class="meta-separator">•</span>
            <span class="meta-text">Submitted: {{ review.submissionDate | date:'mediumDate' }}</span>
            <span class="meta-separator" *ngIf="review.daysOld !== undefined">•</span>
            <span class="meta-text" *ngIf="review.daysOld !== undefined">{{ review.daysOld }} days ago</span>
          </div>
        </div>

        <button class="review-btn" (click)="onReviewClick(review)">
          <i class="fa-solid fa-eye"></i>
          Review
        </button>
      </div>
    </ng-container>

    <ng-template #noReviews>
      <p class="text-center text-muted p-4">No recent reviews found.</p>
    </ng-template>
  </div>
</div>
