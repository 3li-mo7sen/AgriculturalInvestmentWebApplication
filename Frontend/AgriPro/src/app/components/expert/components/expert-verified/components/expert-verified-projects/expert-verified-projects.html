<div class="verified-project-grid">
  <ng-container *ngIf="projects && projects.length > 0; else noProjects">
    <article class="verified-card" *ngFor="let project of projects">
      <div class="project-card-image">
        <div class="image-badge badge-verified">
          <i class="fa-solid fa-circle-check"></i> {{ project.status }}
        </div>
      </div>

      <div class="card-body">
        <h3>{{ project.title }}</h3>

        <div class="meta-row farmer-name">Farmer: {{ project.farmerName }}</div>

        <div class="meta-row verified-date">
          <i class="fa-regular fa-calendar-days"></i>
          Verified: {{ project.verificationDate | date: 'mediumDate' }}
        </div>

        <div class="meta-row notes-text" *ngIf="project.verificationNotes">
          <small class="text-muted">{{ project.verificationNotes }}</small>
        </div>

        <div class="footer-row mt-3">
          <span class="investors">
            <i class="fa-solid fa-user-group"></i> {{ project.investorsCount }} investors
          </span>
          <span class="funding font-weight-bold text-success">
            EGP {{ project.fundingRaised | number }}
          </span>
        </div>

        <button class="btn-view mt-3">
          <i class="fa-regular fa-eye"></i> View Details
        </button>
      </div>
    </article>
  </ng-container>

  <ng-template #noProjects>
    <div class="w-100 text-center p-5 text-muted">
      No verified projects found.
    </div>
  </ng-template>
</div>
