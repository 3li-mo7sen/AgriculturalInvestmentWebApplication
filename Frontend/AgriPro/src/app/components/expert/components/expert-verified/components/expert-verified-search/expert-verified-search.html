<div class="verified-search-panel">
  <div class="search-input-group">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search"
           placeholder="Search verified projects..."
           [(ngModel)]="searchTerm"
           (input)="onInput()" />
  </div>
  <div class="filter-dropdown">
    <select aria-label="Filter by crop"
            [(ngModel)]="selectedCrop"
            (change)="onSelect()">
      <option *ngFor="let crop of crops" [value]="crop">{{ crop }}</option>
    </select>
  </div>
</div>
