<div class="full-width-nav">
  <nav class="expert-navbar">
    <!-- Left Title Section -->
    <div class="navbar-title">
      <h3>{{ pageTitle }}</h3>
      <p>{{ pageSubtitle }}</p>
    </div>

  <!-- Right Section -->
  <div class="navbar-content">
    <!-- Search Bar -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" class="search-input" placeholder="Search..." />
    </div>

    <!-- Notification and Profile -->
    <div class="navbar-actions">
      <div class="dropdown-wrapper">
        <button class="btn-notification" type="button" (click)="toggleNotifications($event)">
          <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="notification-badge">{{ notificationCount }}</span>
        </button>

        <div class="dropdown-card notifications-menu" *ngIf="showNotificationsMenu">
          <div class="dropdown-card-header">
            <span>Notifications</span>
            <button type="button" class="btn-clear" (click)="markAllRead($event)">Mark all as read</button>
          </div>
          <div class="dropdown-item">
            <div class="item-icon success-icon"><i class="fa-solid fa-check"></i></div>
            <div class="item-body">
              <strong>Project Approved</strong>
              <p>Your Wheat Farm project has been verified and approved.</p>
              <span class="item-time">2 hours ago</span>
            </div>
          </div>
          <div class="dropdown-item">
            <div class="item-icon info-icon"><i class="fa-solid fa-arrow-trend-up"></i></div>
            <div class="item-body">
              <strong>New Investment</strong>
              <p>You received a new investment of EGP 25,000.</p>
              <span class="item-time">5 hours ago</span>
            </div>
          </div>
          <div class="dropdown-item">
            <div class="item-icon success-icon"><i class="fa-solid fa-file-check"></i></div>
            <div class="item-body">
              <strong>Document Verified</strong>
              <p>Your land ownership document has been verified.</p>
              <span class="item-time">1 day ago</span>
            </div>
          </div>
          <button type="button" class="dropdown-link" (click)="goToNotifications()">View all notifications</button>
        </div>
      </div>

      <div class="dropdown-wrapper">
        <button class="btn-user" type="button" (click)="toggleAccount($event)">
          <span class="user-avatar"><i class="fa-solid fa-user"></i></span>
          <span class="user-name">{{ userName }}</span>
        </button>
        <div class="dropdown-card account-menu" *ngIf="showAccountMenu">
          <button type="button" class="dropdown-link" (click)="goToProfile()">My Profile</button>
          <button type="button" class="dropdown-link" (click)="goToSettings()">Settings</button>
          <button type="button" class="dropdown-link" (click)="goToHelpCenter()">Help Center</button>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-link logout-link" (click)="logout()">Logout</button>
        </div>
      </div>
    </div>
  </div>
</nav>
</div>
