<section class="wallet-cards-grid">
 
  <article class="wallet-card card-primary">
    <div class="wallet-card-action action-wallet">
      <i class="fa-solid fa-wallet"></i>
    </div>
    <div>
      <p class="wallet-card-label">Wallet Balance</p>
      <h3>EGP {{ balance | number }}</h3>
      <p class="wallet-card-note">Available to invest</p>
    </div>
  </article>

 
  <article class="wallet-card card-light">
    <div class="wallet-card-action action-blue">
      <i class="fa-solid fa-dollar-sign"></i>
    </div>
    <div>
      <p class="wallet-card-label">Total Invested</p>
      <h3>EGP {{ totalInvested | number }}</h3>
      <p class="wallet-card-note">In active projects</p>
    </div>
  </article>

  
  <article class="wallet-card card-light">
    <div class="wallet-card-action action-green">
      <i class="fa-solid fa-chart-line"></i>
    </div>
    <div>
      <p class="wallet-card-label">Total Returns</p>
      <h3>EGP {{ totalReturns | number }}</h3>
      <p class="wallet-card-note">All time earnings</p>
    </div>
  </article>
</section>
