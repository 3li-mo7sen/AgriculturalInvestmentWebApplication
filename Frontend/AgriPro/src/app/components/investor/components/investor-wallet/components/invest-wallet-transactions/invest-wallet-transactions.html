<section class="history-card">
  <div class="history-header">
    <h2>Recent Transactions</h2>
  </div>

  <div class="transaction-list" *ngIf="transactions && transactions.length > 0; else noTransactions">
    <article class="transaction-row" *ngFor="let item of transactions">

    
      <div class="transaction-icon" [ngClass]="item.amount >= 0 ? 'icon-green' : 'icon-muted'">
        <svg *ngIf="item.amount >= 0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="M6 6v12h12" />
        </svg>
        <svg *ngIf="item.amount < 0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 18 18 6" />
          <path d="M6 18h12V6" />
        </svg>
      </div>

    
      <div class="transaction-info">
        <h3>{{ item.description }}</h3>
        <p>
          {{ item.date | date: 'mediumDate' }}
          <span *ngIf="item.projectName"> • {{ item.projectName }}</span>
        </p>
      </div>

      
      <div class="transaction-meta">
        <span class="amount" [ngClass]="item.amount >= 0 ? 'positive' : 'negative'">
          {{ item.amount >= 0 ? '+' : '' }}EGP {{ item.amount | number }}
        </span>
        <span class="status completed">
          <i class="fa-regular fa-circle-check"></i> {{ item.status }}
        </span>
      </div>
    </article>
  </div>

  <ng-template #noTransactions>
    <div class="p-4 text-center text-muted">
      <i class="fa-solid fa-receipt fs-3 mb-2 text-secondary"></i>
      <p class="m-0">No transactions recorded yet.</p>
    </div>
  </ng-template>
</section>
