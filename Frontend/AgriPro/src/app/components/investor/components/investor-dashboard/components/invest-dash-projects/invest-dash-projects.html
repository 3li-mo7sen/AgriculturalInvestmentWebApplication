<div class="projects-section">
  <div class="section-header">
    <h2>Featured Projects</h2>
    <a routerLink="/investor/available-projects" class="view-all">Browse All <i class="fa-solid fa-arrow-up-right"></i></a>
  </div>

  <div class="projects-grid" *ngIf="projects && projects.length > 0; else emptyProjects">
    <div class="project-card" *ngFor="let proj of projects">
      <div class="project-image" [class.empty]="!proj.imageUrl">
        <img *ngIf="proj.imageUrl" [src]="proj.imageUrl" [alt]="proj.title" />
        <div *ngIf="!proj.imageUrl" class="no-image-placeholder">
          <i class="fa-solid fa-image"></i>
        </div>
      </div>
      <div class="project-info">
        <h3>{{ proj.title || 'Agricultural Project' }}</h3>
        <p class="location" *ngIf="proj.location"><i class="fa-solid fa-location-dot"></i> {{ proj.location }}</p>
        <div class="roi-range">
          {{ proj.expectedRoi || 'N/A' }}
          <span class="label" *ngIf="proj.minInvestment">min. EGP {{ proj.minInvestment | number }}</span>
        </div>
        <div class="progress-bar" *ngIf="proj.fundingProgress !== undefined">
          <div class="progress-fill" [style.width.%]="proj.fundingProgress"></div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyProjects>
    <div class="p-4 text-center text-muted bg-white rounded-3 shadow-sm my-3">
      <i class="fa-solid fa-wheat-awn-circle-exclamation mb-2 fs-3 text-secondary"></i>
      <p class="m-0">No available projects at the moment.</p>
    </div>
  </ng-template>
</div>
