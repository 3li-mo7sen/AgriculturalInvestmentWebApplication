<div class="investor-investments-container">

  <div *ngIf="isLoading" class="skeleton-wrapper">
    
    <div class="skeleton-cards-grid">
      <div class="skeleton-card" *ngFor="let i of [1,2,3,4]">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
      </div>
    </div>

   
    <div class="skeleton-search"></div>

  
    <div class="skeleton-projects-grid">
      <div class="skeleton-project-card" *ngFor="let i of [1,2,3]">
        <div class="skeleton-img"></div>
        <div class="skeleton-body">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line text"></div>
          <div class="skeleton-line stats"></div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <ng-container *ngIf="!isLoading && !errorMessage">
    <app-invest-investments-cards [investments]="investments"></app-invest-investments-cards>

    <app-invest-investments-search (searchChanged)="onSearchChange($event)"
                                   (statusChanged)="onStatusChange($event)">
    </app-invest-investments-search>

    <app-invest-investments-projects [investments]="filteredInvestments"></app-invest-investments-projects>
  </ng-container>
</div>
