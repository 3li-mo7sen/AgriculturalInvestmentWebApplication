<section class="settings-card">
  <div class="settings-header">
    <h2>Change Password</h2>
    <p>Update your password regularly for better security</p>
  </div>

  <div class="form-grid">
    <div class="form-group full-width">
      <label for="currentPassword">Current Password</label>
      <div class="password-field">
        <input id="currentPassword" type="password" placeholder="Enter current password" />
        <button type="button" class="eye-btn" aria-label="Toggle current password visibility">👁️</button>
      </div>
    </div>

    <div class="form-group full-width">
      <label for="newPassword">New Password</label>
      <div class="password-field">
        <input id="newPassword" type="password" placeholder="Enter new password" />
        <button type="button" class="eye-btn" aria-label="Toggle new password visibility">👁️</button>
      </div>
    </div>

    <div class="form-group full-width">
      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" />
    </div>
  </div>

  <button class="save-btn" type="button">
    <span class="btn-icon">🔒</span>
    Update Password
  </button>
</section>

<section class="settings-card security-card">
  <div class="settings-header">
    <h2>Security Options</h2>
    <p>Add an extra layer of security to your account</p>
  </div>

  <div class="notification-row">
    <div>
      <h3>Two-Factor Authentication</h3>
      <p>Add an extra layer of security to your account</p>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" checked />
      <span></span>
    </label>
  </div>

  <div class="notification-row">
    <div>
      <h3>Login Alerts</h3>
      <p>Get notified when someone logs into your account</p>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" checked />
      <span></span>
    </label>
  </div>
</section>
