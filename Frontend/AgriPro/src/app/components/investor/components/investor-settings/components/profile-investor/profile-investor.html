<div class="profile-card">
  <div class="profile-card-header">
    <div class="profile-title">
      <span class="profile-icon">
        <i class="fa-regular fa-user"></i>
      </span>
      <div>
        <h2>Profile Information</h2>
        <p>Update your personal information</p>
      </div>
    </div>

    <button type="button" class="btn-save" (click)="onSave()" [disabled]="isSaving || isLoading">
      <i class="fa-solid fa-floppy-disk"></i>
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>

  <div *ngIf="successMessage" class="alert alert-success mt-3" style="padding: 10px; background: #e8f5e9; color: #2e7d32; border-radius: 6px;">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3" style="padding: 10px; background: #ffebee; color: #c62828; border-radius: 6px;">
    {{ errorMessage }}
  </div>

  <form class="profile-form" (ngSubmit)="onSave()" style="margin-top: 15px;">
    <div class="form-row two-cols">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="profileData.name" name="name" placeholder="Enter your full name" />
      </div>
      <div class="field-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="profileData.email" name="email" placeholder="Enter your email address" />
      </div>
    </div>

    <div class="form-row two-cols">
      <div class="field-group">
        <label>Phone Number</label>
        <input type="tel" [(ngModel)]="profileData.phone" name="phone" placeholder="Enter your phone number" />
      </div>
      <div class="field-group">
        <label>Location</label>
        <input type="text" [(ngModel)]="profileData.location" name="location" placeholder="e.g. Cairo, Egypt" />
      </div>
    </div>
    <!--
    <div class="form-row">
      <div class="field-group full-width">
        <label>Land Details</label>

        <textarea [(ngModel)]="profileData.landDetails" name="landDetails" rows="3" class="form-control" placeholder="Describe your land details"></textarea>
      </div>
    </div>
    -->
  </form>
</div>
