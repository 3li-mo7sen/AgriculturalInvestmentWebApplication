<div class="history-page">

  <!-- 👈 Skeleton Loading جمالي يتفاعل أثناء تحميل البيانات -->
  <div *ngIf="isLoading" class="skeleton-wrapper">
    <!-- Top Cards Skeleton -->
    <div class="skeleton-cards-grid">
      <div class="skeleton-card" *ngFor="let i of [1, 2, 3, 4]">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
      </div>
    </div>

    <!-- Search Skeleton -->
    <div class="skeleton-search"></div>

    <!-- Table Skeleton -->
    <div class="skeleton-table">
      <div class="skeleton-table-header"></div>
      <div class="skeleton-table-row" *ngFor="let i of [1, 2, 3, 4, 5]">
        <div class="skeleton-line text"></div>
        <div class="skeleton-line text"></div>
        <div class="skeleton-line text"></div>
        <div class="skeleton-line badge"></div>
      </div>
    </div>
  </div>

  <!-- رسالة الخطأ -->
  <div *ngIf="!isLoading && errorMessage" class="alert-error-box">
    <i class="fa-solid fa-circle-exclamation error-icon"></i>
    <div class="error-content">
      <h4>Unable to load data</h4>
      <p>{{ errorMessage }}</p>
      <button class="btn-retry" (click)="fetchHistory()">
        <i class="fa-solid fa-rotate-right"></i> Try Again
      </button>
    </div>
  </div>

  <!-- المحتوى الأصلي بعد التحميل -->
  <ng-container *ngIf="!isLoading && !errorMessage">
    <app-invest-history-cards [summaryData]="historyData"></app-invest-history-cards>

    <app-invest-history-search (searchChanged)="onSearchChange($event)"
                               (statusChanged)="onStatusChange($event)">
    </app-invest-history-search>

    <app-invest-history-list [historyItems]="filteredHistory"></app-invest-history-list>
  </ng-container>

</div>
