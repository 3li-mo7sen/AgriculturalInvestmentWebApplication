<div class="search-container">
  <div class="search-bar">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text"
           placeholder="Search transactions..."
           [value]="searchText"
           (input)="onSearchInput($event)"
           class="search-input" />
  </div>

  <div class="filters-container">
    <div class="status-dropdown">
      <button class="dropdown-button"
              (click)="toggleStatusDropdown(); $event.stopPropagation()"
              type="button">
        {{ selectedStatus }}
        <i class="fa-solid fa-chevron-down dropdown-icon" [class.open]="showStatusDropdown"></i>
      </button>
      <div class="dropdown-menu" *ngIf="showStatusDropdown" (click)="$event.stopPropagation()">
        <div *ngFor="let status of statuses"
             class="dropdown-item"
             (click)="selectStatus(status); $event.stopPropagation()"
             [class.active]="selectedStatus === status">
          {{ status }}
          <i *ngIf="selectedStatus === status" class="fa-solid fa-check checkmark"></i>
        </div>
      </div>
    </div>
  </div>
</div>
