<div class="cards-container">
  <div *ngFor="let card of cards" class="card">
    <div class="card-content">
      <div class="card-text">
        <p class="card-title">{{ card.title }}</p>
        <p class="card-value" [ngClass]="{ 'green': card.title === 'Total Returns' || card.title === 'Average ROI' }">
          {{ card.value }}
        </p>
      </div>
      <div class="card-icon" [ngClass]="{ 'icon-green': card.title === 'Total Returns' || card.title === 'Average ROI' }">
        {{ card.icon }}
      </div>
    </div>
  </div>
</div>
