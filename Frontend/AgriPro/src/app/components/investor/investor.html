
<div class="dashboard-wrapper">
  <aside class="sidebar" [class.collapsed]="isCollapsed">

    <div class="sidebar-header">
      <div class="logo-box" *ngIf="!isCollapsed" routerLink="/home" style="cursor: pointer;">
        <img src="../../../assets/images/logo-new.png" alt="Agri-Pro">
        <span>Agri-Pro</span>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="fa-solid" [ngClass]="isCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
      </button>
    </div>

    <nav class="menu-items">
      <a routerLink="dashboard" routerLinkActive="active-link">
        <i class="fa-solid fa-grid-horizontal"></i>
        <span *ngIf="!isCollapsed">Dashboard</span>
      </a>

      <a routerLink="available-projects" routerLinkActive="active-link">
        <i class="fa-regular fa-folder-open"></i>
        <span *ngIf="!isCollapsed">Available Projects</span>
      </a>

      <a routerLink="my-investments" routerLinkActive="active-link">
        <i class="fa-solid fa-chart-line"></i>
        <span *ngIf="!isCollapsed">My Investments</span>
      </a>

      <a routerLink="investment-history" routerLinkActive="active-link">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span *ngIf="!isCollapsed">Investment History</span>
      </a>

      

      <a routerLink="profile" routerLinkActive="active-link">
        <i class="fa-solid fa-gear"></i>
        <span *ngIf="!isCollapsed">My profile</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a (click)="logout()" class="logout-link">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span *ngIf="!isCollapsed">Logout</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <app-investor-nav></app-investor-nav>
    <router-outlet></router-outlet>
  </main>
</div>
