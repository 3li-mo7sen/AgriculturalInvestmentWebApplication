<section class="distribution-card">
  <div class="card-header">
    <h3>User Distribution</h3>
    <p class="muted">Platform users breakdown by role</p>
  </div>

  <div *ngIf="distribution && distribution.length > 0; else noData">
    <div class="dist-list">
      <div class="dist-row" *ngFor="let item of distribution">
        <div class="dist-info">
          <span class="dist-label">{{ item.role }}s</span>
          <span class="dist-value">{{ item.count | number }} <small>({{ getPercentage(item.count) }}%)</small></span>
        </div>

        <div class="dist-bar-track">
          <div class="dist-bar-fill"
               [ngClass]="getRoleColorClass(item.role)"
               [style.width.%]="getPercentage(item.count)">
          </div>
        </div>
      </div>
    </div>

    <div class="total-section">
      <span class="total-label">Total Platform Users</span>
      <span class="total-value">{{ getTotalUsers() | number }}</span>
    </div>
  </div>

  <ng-template #noData>
    <div class="empty-dist">
      <span class="empty-icon">📊</span>
      <p>No user distribution data available</p>
    </div>
  </ng-template>
</section>
