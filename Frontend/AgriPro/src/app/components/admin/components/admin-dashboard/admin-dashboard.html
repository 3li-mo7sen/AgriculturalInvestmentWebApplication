<div class="dashboard-container">
	
	<div *ngIf="isLoading" class="skeleton-wrapper">
		<div class="skeleton-cards-grid">
			<div class="skeleton-card" *ngFor="let i of [1, 2, 3, 4]">
				<div class="skeleton-line skeleton-title"></div>
				<div class="skeleton-line skeleton-number"></div>
				<div class="skeleton-line skeleton-sub"></div>
			</div>
		</div>

		<div class="skeleton-alert"></div>

		<div class="skeleton-row">
			<div class="skeleton-box skeleton-dist"></div>
			<div class="skeleton-box skeleton-act"></div>
		</div>
	</div>

	
	<div *ngIf="!isLoading && dashboardData" class="dashboard-content fade-in">
		<app-admin-dash-cards [stats]="dashboardData.stats"></app-admin-dash-cards>

		<app-admin-dash-alerts [alerts]="dashboardData.systemAlerts"></app-admin-dash-alerts>

		<section class="dashboard-row">
			<div class="full-width">
				<app-admin-dash-distribution [distribution]="dashboardData.userDistribution"></app-admin-dash-distribution>
			</div>
		</section>

		<app-admin-dash-activity [activities]="dashboardData.recentActivities"></app-admin-dash-activity>
	</div>
</div>
