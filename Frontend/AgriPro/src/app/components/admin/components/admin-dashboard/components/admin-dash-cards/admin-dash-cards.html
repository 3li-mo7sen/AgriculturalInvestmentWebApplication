<section class="dash-cards">
  <article class="dash-card"
           *ngFor="let card of stats"
           [ngClass]="getCardThemeClass(card.title)">
    <div class="dash-card-header">
      <span class="card-title">{{ card.title }}</span>
      <div class="dash-icon">
        <span>{{ getCardIcon(card.title) }}</span>
      </div>
    </div>

    <div class="dash-card-body">
      <h2 class="card-value">{{ card.value }}</h2>

      <p class="dash-change" *ngIf="card.change" [ngClass]="card.changeType === 'positive' ? 'positive' : 'negative'">
        <span class="change-badge">
          {{ card.changeType === 'positive' ? '↑' : '↓' }} {{ card.change }}
        </span>
        <span class="change-period">vs last month</span>
      </p>

      <p class="dash-note" *ngIf="card.description">{{ card.description }}</p>
    </div>
  </article>
</section>
