<section class="dash-alerts">
  <div class="alerts-header">
    <div class="header-left">
      <h2>System Alerts</h2>
      <span class="alert-pill" *ngIf="alerts && alerts.length > 0">
        {{ alerts.length }} Active
      </span>
    </div>
  </div>

  <div class="alerts-list" *ngIf="alerts && alerts.length > 0; else noAlerts">
    <div *ngFor="let alert of alerts" class="alert-card" [ngClass]="getAlertClass(alert.type)">
      <div class="alert-icon-badge">
        <span>{{ getAlertIcon(alert.type) }}</span>
      </div>

      <div class="alert-content">
        <p class="alert-message">{{ alert.message }}</p>
        <!--
        <span class="alert-time" *ngIf="alert.createdAt">
          {{ alert.createdAt | date:'mediumTime' }} • {{ alert.createdAt | date:'mediumDate' }}
        </span>
        -->
      </div>
    </div>
  </div>

  <ng-template #noAlerts>
    <div class="empty-alerts">
      <div class="empty-icon">🛡️</div>
      <p class="empty-title">All Systems Normal</p>
      <p class="empty-sub">There are no active system alerts or issues detected at this time.</p>
    </div>
  </ng-template>
</section>
