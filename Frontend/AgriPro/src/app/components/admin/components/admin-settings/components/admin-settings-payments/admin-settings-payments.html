<section class="payment-settings-page">
  <article class="settings-card">
    <div class="settings-card-header">
      <div>
        <h2>Payment Gateway</h2>
        <p>Configure payment processing settings</p>
      </div>
      <div class="settings-icon">💳</div>
    </div>

    <div class="settings-grid">
      <div class="settings-field">
        <label>Payment Gateway</label>
        <div class="select-control">
          <select>
            <option>Stripe</option>
            <option>PayPal</option>
            <option>Fawry</option>
            <option>PayTabs</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
      </div>

      <div class="settings-field">
        <label>Environment</label>
        <div class="select-control">
          <select>
            <option>Sandbox (Testing)</option>
            <option>Production</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
      </div>

      <div class="settings-field full-width">
        <label>API Key</label>
        <input type="text" value="sk_test_..." />
      </div>

      <div class="settings-field full-width">
        <label>Webhook Secret</label>
        <input type="text" value="whsec_..." />
      </div>
    </div>
  </article>

  <article class="settings-card">
    <div class="settings-card-header">
      <div>
        <h2>Payout Settings</h2>
        <p>Configure farmer payout settings</p>
      </div>
      <div class="settings-icon">🪙</div>
    </div>

    <div class="settings-grid">
      <div class="settings-field">
        <label>Payout Frequency</label>
        <div class="select-control">
          <select>
            <option>Monthly</option>
            <option>Weekly</option>
            <option>Quarterly</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
      </div>

      <div class="settings-field">
        <label>Minimum Payout (EGP)</label>
        <input type="number" value="1000" />
      </div>
    </div>
  </article>
</section>
