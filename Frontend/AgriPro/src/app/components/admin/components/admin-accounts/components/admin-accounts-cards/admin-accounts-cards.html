<section class="accounts-summary">
  <div class="summary-grid">
    <article class="summary-card">
      <div class="summary-card-body">
        <div>
          <div class="summary-title">Total Users</div>
          <div class="summary-value">{{ totalUsers }}</div>
        </div>
        <div class="summary-icon bg-green">🛡️</div>
      </div>
    </article>

    <article class="summary-card">
      <div class="summary-card-body">
        <div>
          <div class="summary-title">Active</div>
          <div class="summary-value text-success">{{ activeUsers }}</div>
        </div>
        <div class="summary-icon bg-light-green">✅</div>
      </div>
    </article>

    <article class="summary-card">
      <div class="summary-card-body">
        <div>
          <div class="summary-title">Pending KYC</div>
          <div class="summary-value">{{ pendingKycUsers }}</div>
        </div>
        <div class="summary-icon bg-yellow">⏳</div>
      </div>
    </article>

    <article class="summary-card">
      <div class="summary-card-body">
        <div>
          <div class="summary-title">Suspended / Inactive</div>
          <div class="summary-value text-danger">{{ suspendedUsers }}</div>
        </div>
        <div class="summary-icon bg-red">🚫</div>
      </div>
    </article>
  </div>
</section>
