<section class="metric-card metric-growth-card">
  <div class="metric-header">
    <div>
      <h2>Platform Growth</h2>
      <p>Users & Projects over time</p>
    </div>
    <span class="metric-icon"><i class="fa-solid fa-chart-line"></i></span>
  </div>

  <div class="metric-chart">
    <div class="growth-grid">
      <div class="growth-column">
        <span class="growth-bar projects" style="height: 62%;"></span>
        <span class="growth-bar users" style="height: 80%;"></span>
      </div>
      <div class="growth-column">
        <span class="growth-bar projects" style="height: 66%;"></span>
        <span class="growth-bar users" style="height: 84%;"></span>
      </div>
      <div class="growth-column">
        <span class="growth-bar projects" style="height: 70%;"></span>
        <span class="growth-bar users" style="height: 88%;"></span>
      </div>
      <div class="growth-column">
        <span class="growth-bar projects" style="height: 74%;"></span>
        <span class="growth-bar users" style="height: 92%;"></span>
      </div>
      <div class="growth-column">
        <span class="growth-bar projects" style="height: 78%;"></span>
        <span class="growth-bar users" style="height: 96%;"></span>
      </div>
      <div class="growth-column">
        <span class="growth-bar projects" style="height: 82%;"></span>
        <span class="growth-bar users" style="height: 100%;"></span>
      </div>
    </div>

    <div class="growth-labels">
      <span>Jan</span>
      <span>Feb</span>
      <span>Mar</span>
      <span>Apr</span>
      <span>May</span>
      <span>Jun</span>
    </div>
  </div>

  <div class="metric-legend">
    <span><span class="legend-dot users"></span>Users</span>
    <span><span class="legend-dot projects"></span>Projects</span>
  </div>
</section>
