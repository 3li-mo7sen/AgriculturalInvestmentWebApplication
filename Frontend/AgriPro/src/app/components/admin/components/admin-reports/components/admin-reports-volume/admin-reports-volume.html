<section class="metric-card metric-volume-card">
  <div class="metric-header">
    <div>
      <h2>Investment Volume</h2>
      <p>Monthly investment in millions (EGP)</p>
    </div>
    <span class="metric-icon"><i class="fa-solid fa-chart-column"></i></span>
  </div>

  <div class="metric-chart volume-chart">
    <div class="volume-column" style="height: 48%;"></div>
    <div class="volume-column" style="height: 52%;"></div>
    <div class="volume-column" style="height: 62%;"></div>
    <div class="volume-column" style="height: 68%;"></div>
    <div class="volume-column" style="height: 76%;"></div>
    <div class="volume-column" style="height: 86%;"></div>
  </div>

  <div class="volume-labels">
    <span>Jan</span>
    <span>Feb</span>
    <span>Mar</span>
    <span>Apr</span>
    <span>May</span>
    <span>Jun</span>
  </div>
</section>
